name: Release AppImages
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  # Run workflow every day at midnight and on manual trigger
  schedule:
    - cron: "0 0 * * *"  
  workflow_dispatch: 

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.sync_check.outputs.should_release }}
      app_version: ${{ steps.sync_check.outputs.app_version }}
      raw_version_x64: ${{ steps.sync_check.outputs.raw_version_x64 }}
      raw_version_aa64: ${{ steps.sync_check.outputs.raw_version_aa64 }}
    steps:
      # Checkout the repo
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 
          token: ${{ secrets.GITHUB_TOKEN }}
      # Sync the version from EEO
      - name: Sync and check for new version
        id: sync_check
        run: |
          chmod a+x ./sync_from_eeo.sh 2>/dev/null || true
          ./sync_from_eeo.sh
          
          RAW_VER_x64=$(jq -r '.architectures.x86_64.version' manifest.json 2>/dev/null || echo "")
          RAW_VER_aa64=$(jq -r '.architectures.aarch64.version' manifest.json 2>/dev/null || echo "")
          
          APP_VER=$(echo "$RAW_VER_x64" | cut -d. -f1-3)
          echo "raw_version_x64=${RAW_VER_x64}" >> $GITHUB_OUTPUT
          echo "raw_version_aa64=${RAW_VER_aa64}" >> $GITHUB_OUTPUT
          echo "app_version=${APP_VER}" >> $GITHUB_OUTPUT
          # If the tag already exists, we don't need to build or release
          if git rev-parse "$APP_VER" >/dev/null 2>&1; then
            echo "Tag $APP_VER already exists."
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "New version detected ($APP_VER). Preparing to build."
            echo "should_release=true" >> $GITHUB_OUTPUT

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            if [ -n "$(git status --porcelain)" ]; then
              git add manifest.json
              git commit -m "bot: Auto-update manifest to $APP_VER"
              git push
            fi
          fi
  build:
    needs: [check-version]
    if: needs.check-version.outputs.should_release == 'true' || github.event_name == 'workflow_dispatch'
    name: "Build AppImage (${{ matrix.arch }})"
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-latest
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0 
          token: ${{ secrets.GITHUB_TOKEN }}
      # Here we will build the AppImage
      - name: Build
        run: |
          make -j$(nproc) ${{ matrix.arch }}
      # Upload the built AppImage as an artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppImage-${{ matrix.arch }}
          path: 'dist/**/*.AppImage*'

  release:
    needs: [check-version, build]
    if: needs.check-version.outputs.should_release == 'true'  || github.event_name == 'workflow_dispatch'
    permissions: write-all
    runs-on: ubuntu-latest

    steps:
      # Download the built AppImage artifact
      - uses: actions/download-artifact@v4
        with:
          pattern: AppImage-*      
          path: dist
          merge-multiple: true
      # Create a versioned release and upload the AppImage
      - name: Create versioned release
        uses: softprops/action-gh-release@v2
        with:
          name: "Version ${{ needs.check-version.outputs.app_version }} (Unofficial)"
          tag_name: "${{ needs.check-version.outputs.app_version }}"
          prerelease: false
          draft: false
          generate_release_notes: false
          make_latest: false
          body: |
            It is recommended to use [AM/AppMan](https://github.com/ivan-hc/AM) [Gear Lever](https://github.com/mijorus/gearlever) to manage and integrate the AppImage.
            
            For x86_64:
            ```bash
            # Download the AppImage
            wget https://github.com/${{ github.repository }}/releases/download/${{ needs.check-version.outputs.app_version }}/ClassIn-${{ needs.check-version.outputs.raw_version_x64 }}-x86_64.AppImage
            
            # Install with Gear Lever
            flatpak run it.mijorus.gearlever --integrate ClassIn-${{ needs.check-version.outputs.raw_version_x64 }}-x86_64.AppImage
            
            # Or run it manually
            chmod +x ClassIn-${{ needs.check-version.outputs.raw_version_x64 }}-x86_64.AppImage
            ./ClassIn-${{ needs.check-version.outputs.raw_version_x64 }}-x86_64.AppImage
            ```
            
            For aarch64:
            ```bash
            # Download the AppImage
            wget https://github.com/${{ github.repository }}/releases/download/${{ needs.check-version.outputs.app_version }}/ClassIn-${{ needs.check-version.outputs.raw_version_aa64 }}-aarch64.AppImage
            
            # Install with Gear Lever
            flatpak run it.mijorus.gearlever --integrate ClassIn-${{ needs.check-version.outputs.raw_version_aa64 }}-aarch64.AppImage
            
            # Or run it manually
            chmod +x ClassIn-${{ needs.check-version.outputs.raw_version_aa64 }}-aarch64.AppImage
            ./ClassIn-${{ needs.check-version.outputs.raw_version_aa64 }}-aarch64.AppImage
            ```
            
            *Note for AM/AppMan users: The intrucsions to install ClassIn is included in [the README](https://github.com/imngkhang/classin-appimage-wrapper/#install-the-appimage). You don't need to run the above commands.*

            ## Issues & Support
            Please report issues in the [GitHub Issues](https://github.com/imngkhang/classin-appimage-wrapper/issues).
          files: |
            dist/ClassIn*.AppImage*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Create a continuous release and upload the AppImage
      - name: Update continuous release
        uses: softprops/action-gh-release@v2
        with:
          name: "Continuous build (Unofficial)"
          tag_name: "continuous"
          prerelease: false
          draft: false
          generate_release_notes: false
          make_latest: true
          body: |
            It is recommended to use [AM/AppMan](https://github.com/ivan-hc/AM) or [Gear Lever](https://github.com/mijorus/gearlever) to manage and integrate the AppImage.
            
            For x86_64:
            ```bash
            # Download the AppImage
            wget https://github.com/${{ github.repository }}/releases/download/continuous/ClassIn-${{ needs.check-version.outputs.raw_version_x64 }}-x86_64.AppImage
            
            # Install with Gear Lever
            flatpak run it.mijorus.gearlever --integrate ClassIn-${{ needs.check-version.outputs.raw_version_x64 }}-x86_64.AppImage

            # Or run it manually
            chmod +x ClassIn-${{ needs.check-version.outputs.raw_version_x64 }}-x86_64.AppImage
            ./ClassIn-${{ needs.check-version.outputs.raw_version_x64 }}-x86_64.AppImage
            ```
            
            For aarch64:
            ```bash
            # Download the AppImage
            wget https://github.com/${{ github.repository }}/releases/download/continuous/ClassIn-${{ needs.check-version.outputs.raw_version_aa64 }}-aarch64.AppImage

            # Install with Gear Lever
            flatpak run it.mijorus.gearlever --integrate ClassIn-${{ needs.check-version.outputs.raw_version_aa64 }}-aarch64.AppImage

            # Or run it manually
            chmod +x ClassIn-${{ needs.check-version.outputs.raw_version_aa64 }}-aarch64.AppImage
            ./ClassIn-${{ needs.check-version.outputs.raw_version_aa64 }}-aarch64.AppImage
            ```
            
            *Note for AM/AppMan users: The intrucsions to install ClassIn is included in [the README](https://github.com/imngkhang/classin-appimage-wrapper/#install-the-appimage). You don't need to run the above commands.*
            
            ## Issues & Support
            Please report issues in the [GitHub Issues](https://github.com/imngkhang/classin-appimage-wrapper/issues).
          files: |
            dist/ClassIn*.AppImage*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}