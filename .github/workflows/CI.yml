name: Release AppImages
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  # Run workflow every day at midnight and on manual trigger
  schedule:
    - cron: "0 0 * * *"  
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '**/AUTHORS'
      - '**/.gitignore'
      - '**/LICENSE'
      - '**/LICENSE.*'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '**/.gitignore'
      - '**/LICENSE'
      - '**/LICENSE.*'
  workflow_dispatch: 

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.sync_check.outputs.should_release }}
      app_version: ${{ steps.sync_check.outputs.app_version }}
      raw_version_x64: ${{ steps.sync_check.outputs.raw_version_x64 }}
      raw_version_aa64: ${{ steps.sync_check.outputs.raw_version_aa64 }}
    steps:
      # Checkout the repo
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 
          token: ${{ secrets.GITHUB_TOKEN }}
      # Sync the version from EEO
      - name: Sync and check for new version
        id: sync_check
        run: |
          set -euo pipefail
          OLD_VER_x64=$(jq -r '.architectures.x86_64.version' manifest.json 2>/dev/null || echo "")
          OLD_VER_aa64=$(jq -r '.architectures.aarch64.version' manifest.json 2>/dev/null || echo "")

          chmod a+x ./sync_from_eeo.sh 2>/dev/null || true
          ./sync_from_eeo.sh
          
          RAW_VER_x64=$(jq -r '.architectures.x86_64.version' manifest.json 2>/dev/null || echo "")
          RAW_VER_aa64=$(jq -r '.architectures.aarch64.version' manifest.json 2>/dev/null || echo "")
          
          APP_VER=$(echo "$RAW_VER_x64" | cut -d. -f1-3)
          echo "raw_version_x64=${RAW_VER_x64}" >> $GITHUB_OUTPUT
          echo "raw_version_aa64=${RAW_VER_aa64}" >> $GITHUB_OUTPUT
          echo "app_version=${APP_VER}" >> $GITHUB_OUTPUT

          # Check if the tag already exists
          TAG_EXISTS=true
          if ! git rev-parse "$APP_VER" >/dev/null 2>&1; then
            TAG_EXISTS=false
          fi

          # Run the build only if the version has changed or the tag doesn't exist
          if [[ "$OLD_VER_x64" != "$RAW_VER_x64" || "$OLD_VER_aa64" != "$RAW_VER_aa64" || "$TAG_EXISTS" == "false" ]]; then
            echo "New version detected (x64: $OLD_VER_x64 -> $RAW_VER_x64 | aa64: $OLD_VER_aa64 -> $RAW_VER_aa64) or tag doesn't exist. Preparing to build."
            echo "should_release=true" >> $GITHUB_OUTPUT

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            if [ -n "$(git status --porcelain)" ]; then
              git add manifest.json
              git commit -m "bot: Auto-update manifest (x64: $RAW_VER_x64, aa64: $RAW_VER_aa64)"
              git push
            fi
          else
            echo "No new version detected or tag already exists. Skipping build."
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: [check-version]
    if: needs.check-version.outputs.should_release == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request'
    name: "Build AppImage (${{ matrix.arch }})"
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-latest
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0 
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libx11-dev libxcb1-dev libxcb-shm0-dev libxext-dev
      # Here we will build the AppImage
      - name: Build
        run: |
          make -j$(nproc) ${{ matrix.arch }}
      # Upload the built AppImage as an artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppImage-${{ matrix.arch }}
          path: 'dist/**/*.AppImage*'
          retention-days: 30

  release:
    needs: [check-version, build]
    if: needs.check-version.outputs.should_release == 'true'  || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    permissions: write-all
    runs-on: ubuntu-latest

    steps:
      # Checkout and download the built AppImage artifact
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0 
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: AppImage-*      
          path: dist
          merge-multiple: true
      # Create a versioned release and upload the AppImage
      - name: Create versioned release
        uses: softprops/action-gh-release@v2
        with:
          name: "Version ${{ needs.check-version.outputs.app_version }} (Unofficial)"
          tag_name: "${{ needs.check-version.outputs.app_version }}"
          prerelease: false
          draft: false
          generate_release_notes: false
          make_latest: false
          body: |
            It is recommended to use [AM/AppMan](https://github.com/ivan-hc/AM) [Gear Lever](https://github.com/mijorus/gearlever) to manage and integrate the AppImage.
            
            For x86_64:
            ```bash
            # Download the AppImage
            wget https://github.com/${{ github.repository }}/releases/download/${{ needs.check-version.outputs.app_version }}/ClassIn-${{ needs.check-version.outputs.raw_version_x64 }}-x86_64.AppImage
            
            # Install with Gear Lever
            flatpak run it.mijorus.gearlever --integrate ClassIn-${{ needs.check-version.outputs.raw_version_x64 }}-x86_64.AppImage
            
            # Or run it manually
            chmod +x ClassIn-${{ needs.check-version.outputs.raw_version_x64 }}-x86_64.AppImage
            ./ClassIn-${{ needs.check-version.outputs.raw_version_x64 }}-x86_64.AppImage
            ```
            
            For aarch64:
            ```bash
            # Download the AppImage
            wget https://github.com/${{ github.repository }}/releases/download/${{ needs.check-version.outputs.app_version }}/ClassIn-${{ needs.check-version.outputs.raw_version_aa64 }}-aarch64.AppImage
            
            # Install with Gear Lever
            flatpak run it.mijorus.gearlever --integrate ClassIn-${{ needs.check-version.outputs.raw_version_aa64 }}-aarch64.AppImage
            
            # Or run it manually
            chmod +x ClassIn-${{ needs.check-version.outputs.raw_version_aa64 }}-aarch64.AppImage
            ./ClassIn-${{ needs.check-version.outputs.raw_version_aa64 }}-aarch64.AppImage
            ```
            
            *Note for AM/AppMan users: The intrucsions to install ClassIn is included in [the README](https://github.com/imngkhang/classin-appimage-wrapper/#install-the-appimage). You don't need to run the above commands.*

            ## Issues & Support
            Please report issues in the [GitHub Issues](https://github.com/imngkhang/classin-appimage-wrapper/issues).
          files: |
            dist/ClassIn*.AppImage*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Create a continuous release and upload the AppImage
      - name: Update continuous release
        uses: softprops/action-gh-release@v2
        with:
          name: "Continuous build (Unofficial)"
          tag_name: "continuous"
          prerelease: false
          draft: false
          generate_release_notes: false
          make_latest: true
          body: |
            It is recommended to use [AM/AppMan](https://github.com/ivan-hc/AM) or [Gear Lever](https://github.com/mijorus/gearlever) to manage and integrate the AppImage.
            
            For x86_64:
            ```bash
            # Download the AppImage
            wget https://github.com/${{ github.repository }}/releases/download/continuous/ClassIn-${{ needs.check-version.outputs.raw_version_x64 }}-x86_64.AppImage
            
            # Install with Gear Lever
            flatpak run it.mijorus.gearlever --integrate ClassIn-${{ needs.check-version.outputs.raw_version_x64 }}-x86_64.AppImage

            # Or run it manually
            chmod +x ClassIn-${{ needs.check-version.outputs.raw_version_x64 }}-x86_64.AppImage
            ./ClassIn-${{ needs.check-version.outputs.raw_version_x64 }}-x86_64.AppImage
            ```
            
            For aarch64:
            ```bash
            # Download the AppImage
            wget https://github.com/${{ github.repository }}/releases/download/continuous/ClassIn-${{ needs.check-version.outputs.raw_version_aa64 }}-aarch64.AppImage

            # Install with Gear Lever
            flatpak run it.mijorus.gearlever --integrate ClassIn-${{ needs.check-version.outputs.raw_version_aa64 }}-aarch64.AppImage

            # Or run it manually
            chmod +x ClassIn-${{ needs.check-version.outputs.raw_version_aa64 }}-aarch64.AppImage
            ./ClassIn-${{ needs.check-version.outputs.raw_version_aa64 }}-aarch64.AppImage
            ```
            
            *Note for AM/AppMan users: The intrucsions to install ClassIn is included in [the README](https://github.com/imngkhang/classin-appimage-wrapper/#install-the-appimage). You don't need to run the above commands.*
            
            ## Issues & Support
            Please report issues in the [GitHub Issues](https://github.com/imngkhang/classin-appimage-wrapper/issues).
          files: |
            dist/ClassIn*.AppImage*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Cleanup old release assets for continuous release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.check-version.outputs.app_version }}
          CONTINUOUS_TAG: continuous
          CURRENT_VER_X64: ${{ needs.check-version.outputs.raw_version_x64 }}
          CURRENT_VER_AA64: ${{ needs.check-version.outputs.raw_version_aa64 }}
        run: |
          set -euo pipefail

          echo "Cleaning up assets for release $RELEASE_TAG"
          echo "Keeping x64 version: $CURRENT_VER_X64"
          echo "Keeping aa64 version: $CURRENT_VER_AA64"

          for RELEASE_TAG in "$CONTINUOUS_TAG" "$FIXED_TAG"; do

            asset_names=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' 2>/dev/null || echo "")

            if [ -z "$asset_names" ]; then
              echo "No assets found for release $RELEASE_TAG"
              continue
            fi

            for name in $asset_names; do
              if [[ "$name" == ClassIn-*.AppImage* ]]; then  
                # If the asset name contains the current version (x64 or aarch64), we keep it
                if [[ "$name" == *"$CURRENT_VER_X64"* || "$name" == *"$CURRENT_VER_AA64"* ]]; then
                  echo "[$RELEASE_TAG] Keeping current asset: $name"
                # Otherwise we remove it
                else
                  echo "[$RELEASE_TAG] Removing old/different build asset: $name"
                  gh release delete-asset "$RELEASE_TAG" "$name" --yes
                fi
              fi
            done    
          done 